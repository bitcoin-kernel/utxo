<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* The Open Graph card, 1200x630. Rendered to og.png with:
     chromium --headless --window-size=1200,630 --screenshot=og.png og.html */
  :root{--bg:#fbfaf7;--fg:#1a1a1f;--mut:#6b6f7a;--dim:#9a9ea8;--ac:#e8830c;--ac2:#c96d00;--gold:#f2b544;--bd:#ebe7df;
    --sans:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);position:relative;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:absolute;inset:0;background:radial-gradient(700px 420px at 22% 50%,rgba(232,131,12,.16),transparent 65%),radial-gradient(500px 300px at 95% 100%,rgba(9,105,218,.06),transparent 60%)}
  .coin{position:absolute;left:96px;top:115px;width:400px;height:400px;border-radius:50%;filter:drop-shadow(0 30px 50px rgba(120,80,20,.22))}
  .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 210deg,var(--ac) 0%,#ffd98a 22%,#b8650a 48%,var(--gold) 70%,var(--ac) 100%);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
  .ring2{position:absolute;inset:10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55)}
  .face{position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffdf8,#fbf3e2 60%,#f1e3c6);box-shadow:inset 0 3px 0 rgba(255,255,255,.9),inset 0 -28px 56px rgba(184,101,10,.12),inset 0 0 0 1.5px rgba(232,131,12,.18);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .face::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.7),transparent 45%)}
  .amt{font:700 64px/1 var(--mono);letter-spacing:-2px}
  .unit{font:700 15px var(--mono);letter-spacing:.35em;color:var(--ac2);margin-top:12px}
  .coinamt{font:500 19px var(--mono);color:var(--mut);margin-top:10px}.coinamt b{color:var(--fg);font-weight:700}.coinamt span{color:var(--dim)}
  .pill{position:absolute;left:246px;top:548px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:8px 18px;border-radius:99px;border:1.5px solid rgba(26,127,55,.35);background:#eaf6ee;color:#1a7f37;font:700 14px var(--mono);letter-spacing:.16em}
  .pill i{width:9px;height:9px;border-radius:50%;background:#1a7f37;box-shadow:0 0 8px rgba(26,127,55,.6)}
  .text{position:absolute;left:560px;top:118px;width:580px}
  .brand{display:flex;align-items:center;gap:12px;font:800 24px var(--sans);letter-spacing:-.5px}
  .brand i{width:16px;height:16px;border-radius:50%;background:conic-gradient(from 200deg,var(--ac),var(--gold),var(--ac));box-shadow:0 0 12px rgba(232,131,12,.5)}
  h1{margin:34px 0 0;font:800 74px/1.02 var(--sans);letter-spacing:-3.5px}
  h1 em{font-style:normal;background:linear-gradient(90deg,var(--ac),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:26px 0 0;font:500 24px/1.4 var(--sans);color:var(--mut);max-width:540px}
  .chip{margin:36px 0 0;display:inline-block;padding:12px 18px;border:1.5px solid var(--bd);border-radius:14px;background:#fff;font:500 19px var(--mono);color:var(--fg);box-shadow:0 10px 30px rgba(26,26,31,.07)}
  .chip span{color:var(--ac2);font-weight:700}
  .foot{position:absolute;left:560px;bottom:58px;font:500 18px var(--mono);color:var(--dim);letter-spacing:.02em}
  .foot b{color:var(--mut);font-weight:500}
</style>
</head>
<body>
  <div class="coin">
    <div class="ring"></div><div class="ring2"></div>
    <div class="face">
      <div class="amt">40,000</div>
      <div class="unit">SATS</div>
      <div class="coinamt">0.<b>0004</b><span>0000</span> TXBT</div>
    </div>
  </div>
  <div class="pill"><i></i>UNSPENT</div>
  <div class="text">
    <div class="brand"><i></i>utxo</div>
    <h1>One coin, <em>shown</em>.</h1>
    <p class="sub">A txo: URI in, the transaction fetched and re-hashed by bitcoin-kernel in your browser, one output shown as a coin.</p>
    <div class="chip"><span>txo:</span>txbt:dc859328…cdcd6e18:0</div>
  </div>
  <div class="foot"><b>bitcoin-kernel.com/utxo</b> · Bitcoin and the BLAKE2b chain</div>
</body>
</html>
